# ==============================================================================
# dtun 示例配置文件 (dtun-example.conf)
# 取消注释的为【最小必填配置】，非最小配置项（有默认值的配置）已全部加 # 注释
# ==============================================================================

# ------------------------------------------------------------------------------
# [global] 公共配置段
# ------------------------------------------------------------------------------
[global]

# 节点工作模式 (必填: hub 或 spoke)
mode = hub

# 预共享密钥 PSK (必填: 64位十六进制字符，用于加密与 HMAC 认证)
psk = 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff

# Hub 内层静态 IP 及掩码 (Hub 必填；Spoke 可指定静态地址或省略以动态分配)
address = 10.99.0.1/24

# --- 以下为非最小配置项 (使用默认值，按需取消注释) ---
# 虚拟网卡接口名称 (默认: dtun0)
# interface = dtun0

# 本地外层源 IPv4 地址 (默认: 0.0.0.0，自动根据内核路由选择出口 IP)
# local_outer_ip = 0.0.0.0

# 数据面 UDP 监听端口 (默认: 49000)
# data_port = 49000

# 路径探测、离线阈值和快速恢复由自适应链路算法自动管理，不提供配置键。

# 节点标识 Node ID (Hub 默认: 1；Spoke 默认: 0 自动申请分配)
# node_id = 1

# 日志输出对接 syslog (默认: false)
# syslog = true
# syslog_ident = dtund
# syslog_facility = daemon


# ------------------------------------------------------------------------------
# [hub] Hub 节点专属配置段 (仅在 mode = hub 时生效)
# ------------------------------------------------------------------------------
[hub]

# --- 以下全为非最小配置项 (使用默认值，按需取消注释) ---
# Hub 控制面监听 IPv4 地址 (默认: 0.0.0.0)
# bind_address = 0.0.0.0

# Hub 控制面 UDP 监听端口 (默认: 49001)
# bind_port = 49001

# Spoke 内层 IP 分配池 (默认: 从 Hub address 的网络前缀自动推导)
# pool = 10.99.0.0/24

# Hub 状态持久化文件路径 (默认: /var/lib/dtun/hub.state)
# state_file = /var/lib/dtun/hub.state

# Cookie 防刷防护周期 (默认: 30 秒)
# cookie_seconds = 30

# 离线节点的地址和 tunnel/session ID 保留时间（默认: 86400 秒）
# identity_retention = 86400


# ------------------------------------------------------------------------------
# [spoke] Spoke 节点专属配置段 (仅在 mode = spoke 时生效)
# ------------------------------------------------------------------------------
[spoke]

# Hub 控制面外层 IP 地址 (mode = spoke 时必填，示例使用 RFC 5737 测试 IP)
hub_address = 192.0.2.1

# --- 以下为非最小配置项 (使用默认值，按需取消注释) ---
# Hub 控制面端口 (默认: 49001)
# hub_port = 49001

# 本地控制面源端口 (默认: 0 随机端口)
# local_port = 0

# 注册后的 REFRESH 周期和故障加速探测由自适应链路算法自动管理。

# 控制包超时时间 (默认: 5 秒)
# timeout = 5

# 是否注册一次后立即退出 (默认: false)
# once = false
